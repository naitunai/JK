name: 自动编译并打包桌面端 ZIP
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: windows-latest
    env:
      ZIP_NAME: LiteMonitor-Desktop-x64-${{ github.sha }}.zip

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 安装 .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 只还原主程序项目；不要 restore 不存在的 JK.sln
      - name: 还原主程序依赖
        run: dotnet restore LiteMonitor.csproj

      # ✅关键：直接指定主程序 csproj（根目录 LiteMonitor.csproj），
      # 只有项目级 publish 才允许使用 -o/--output；对 .sln 使用 -o 会直接报错
      - name: 编译并打包为单文件绿色版 (Win-x64)
        run: dotnet publish LiteMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: 将编译结果压缩为 ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath $env:ZIP_NAME
        shell: pwsh

      - name: 上传桌面端 ZIP 打包文件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ./${{ env.ZIP_NAME }}
#（注：内容由AI生成）
